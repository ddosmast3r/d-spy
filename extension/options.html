<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки черновиков</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 460px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; }
  input { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 16px; background: #ff8c00; color: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #test { background: #444; margin-left: 8px; }
  #msg { margin-top: 12px; font-size: 13px; }
  .ok { color: #218c5a; } .err { color: #c0392b; }
  small { color: #777; }
</style>
</head>
<body>
  <h1>Черновики ответов</h1>
  <label>Адрес Ollama</label>
  <input id="ollamaHost" placeholder="http://192.168.0.112:11434">
  <small>ПК с Ollama. Работает только в домашней сети при включённом ПК.</small>
  <label>Модель</label>
  <input id="ollamaModel" placeholder="gemma4:12b">
  <label>Название заведения</label>
  <input id="orgTitle" placeholder="Чё? Шашлык">
  <div>
    <button id="save">Сохранить</button>
    <button id="test">Проверить связь</button>
  </div>
  <div id="msg"></div>
  <script src="options.js"></script>
</body>
</html>
